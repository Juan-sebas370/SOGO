# =====================================================================
# Correo de SOGO (recuperación de contraseña) con Gmail
#
# 1. En la cuenta hospedajesebastianfilandia@gmail.com activa la
#    "Verificación en 2 pasos" y crea una "Contraseña de aplicación"
#    (https://myaccount.google.com/apppasswords). Google da 16 letras.
# 2. Copia este archivo con el nombre  correo.local.properties  (en esta
#    misma carpeta backend) y pega la cuenta y esas 16 letras (sin espacios).
# 3. Reinicia el backend con iniciar.ps1.
#
# NO compartas correo.local.properties: la contraseña da acceso al correo.
# =====================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=example.@gmail.com
spring.mail.password=exampleexampleexample
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
