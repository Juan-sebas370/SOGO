# 8080 lo usa el backend de la página web del hospedaje
server.port=${PORT:8081}
spring.jackson.serialization.indent_output=true
server.error.include-message=always
# Render termina el HTTPS antes de llegar aquí: sin esto, Google recibiría una dirección de regreso con http
server.forward-headers-strategy=framework

# Correo (recuperación de contraseña): la cuenta de Gmail y su contraseña de aplicación
# van en backend/correo.local.properties (ver correo.local.ejemplo.properties).
# En producción (Render bloquea SMTP en el plan gratis) salen por Resend con RESEND_API_KEY y MAIL_FROM.
resend.api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:}

# JWT secret (set in env or here for development only)
# Clave de firma de las sesiones: nunca en el repositorio. Se toma de JWT_SECRET o, si no existe,
# el servidor genera una aleatoria al primer arranque y la guarda en jwt.local.properties (ignorado por git).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=60

# Base de datos compartida con la página web (hotel_sebastian).
# La clave NUNCA va en este archivo: se lee de la variable de entorno DB_PASSWORD.
# sogo_user solo puede leer/escribir datos; la estructura la cambian los
# scripts de SOGO/database, por eso Hibernate no toca las tablas (ddl-auto=none).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_sebastian?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:sogo_user}
spring.datasource.password=${DB_PASSWORD:}
# Las conexiones de SOGO trabajan en hora de Colombia (NOW(), CURDATE()), aunque el servidor de la base esté en UTC.
# Es solo de esta sesión: no cambia la zona horaria de la página web, que usa la misma base.
spring.datasource.hikari.connection-init-sql=SET time_zone = '-05:00'
# La base es compartida y el plan limita las conexiones: en producción se baja con DB_POOL_SIZE
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# Frontend URL, used to redirect back after a social login
# La página web usa el 4200; SOGO corre en el 4201
app.frontend-url=${FRONTEND_URL:http://localhost:4201}

# --- OAuth2 social login (optional) ---
# Set these via env vars (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET)
# or paste them here for local development only (never commit real secrets).
# Deliberately NOT using the standard spring.security.oauth2.client.registration.* keys: Spring Boot
# validates those eagerly at startup and refuses to boot the whole app if a client-id is blank.
# OAuth2ClientConfig instead builds the registrations itself and simply skips any provider whose
# id/secret aren't set, so the app (and plain email/password login) still starts without them.
# Google: create credentials at https://console.cloud.google.com/apis/credentials
#   Authorized redirect URI: http://localhost:8081/login/oauth2/code/google
# Las credenciales reales van en backend/oauth.local.properties (ver oauth.local.ejemplo.properties)
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}


# Credenciales de Google guardadas solo en este equipo (opcional: si no existe, SOGO arranca igual)
spring.config.import=optional:file:./oauth.local.properties,optional:file:./correo.local.properties,optional:file:./jwt.local.properties
